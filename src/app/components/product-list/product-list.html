<section>
  <header class="header">
    <h1>Desserts</h1>
    <app-product-search (termChange)="searchTerms.next($event)" />
  </header>

  <div class="grid">
    @for (card of view().cards; track card.product.id) {
      <app-product-card
        [product]="card.product"
        [quantity]="card.quantity"
        (add)="cart.add(card.product)"
        (increment)="cart.increment(card.product)"
        (decrement)="cart.decrement(card.product)"
      />
    } @empty {
      <p class="empty" role="status">
        @if (view().term) {
          No desserts match “{{ view().term }}”. Try another name or category.
        } @else {
          No desserts available right now. Please check back later.
        }
      </p>
    }
  </div>
</section>
