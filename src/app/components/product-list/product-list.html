<section>
  <header class="header">
    <h1>Desserts</h1>
    <app-product-search (termChange)="searchTerms.next($event)" />
  </header>

  <div class="grid">
    @for (product of results().products; track product.id) {
      <app-product-card
        [product]="product"
        [quantity]="quantityOf(product)"
        (add)="cart.add(product)"
        (increment)="cart.increment(product)"
        (decrement)="cart.decrement(product)"
      />
    } @empty {
      <p class="empty" role="status">
        @if (results().term) {
          No desserts match “{{ results().term }}”. Try another name or category.
        } @else {
          No desserts available right now. Please check back later.
        }
      </p>
    }
  </div>
</section>
