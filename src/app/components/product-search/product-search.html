<div class="search" role="search">
  <label class="visually-hidden" for="product-search">Search desserts</label>

  <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
    <path
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      d="m21 21-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z"
    />
  </svg>

  <input
    #input
    id="product-search"
    type="search"
    placeholder="Search desserts"
    autocomplete="off"
    [value]="query()"
    (input)="update(input.value)"
    (keydown.escape)="$event.preventDefault(); clear(input)"
  />

  @if (query()) {
    <button class="clear-btn" type="button" (click)="clear(input)" aria-label="Clear search">
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
        <path
          fill="currentColor"
          d="M8.375 9.375 5 6 1.625 9.375l-1-1L4 5 .625 1.625l1-1L5 4 8.375.625l1 1L6 5l3.375 3.375-1 1Z"
        />
      </svg>
    </button>
  }
</div>
