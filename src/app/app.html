<main>
  <app-product-list
    [products]="products"
    [cart]="cart"
    (add)="addToCart($event)"
    (increment)="increment($event)"
    (decrement)="decrement($event)"
  />
  <app-cart
    [items]="cart"
    [total]="cartTotal"
    (remove)="removeFromCart($event)"
    (clear)="clearCart()"
  />
</main>
