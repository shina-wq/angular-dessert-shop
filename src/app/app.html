<main>
  <app-product-list
    [products]="products"
    [cart]="cart"
    (add)="addToCart($event)"
    (increment)="increment($event)"
    (decrement)="decrement($event)"
  />
  <app-cart
    [items]="cart"
    [total]="cartTotal"
    (remove)="removeFromCart($event)"
    (clear)="clearCart()"
    (confirm)="orderConfirmed = true"
  />
</main>

@if (orderConfirmed) {
  <app-order-confirmation [items]="cart" [total]="cartTotal" (newOrder)="startNewOrder()" />
}

<div class="toast-region" role="status">
  @if (toastMessage()) {
    <p class="toast">{{ toastMessage() }}</p>
  }
</div>
